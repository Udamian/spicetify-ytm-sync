name: Release

# Push a tag like v0.1.0 (it must match __version__ in companion/src/ytm_sync_companion/__init__.py).
# Builds the Windows package, runs the smoke test against the real executables and creates a
# DRAFT release with the zip and its checksum. Review it on GitHub, then publish it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: The tag must match the version in the code
        shell: bash
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('companion/src/ytm_sync_companion/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$version"; exit 1; }
      - run: python -m pip install ./companion pyinstaller
      - run: python scripts/build_release.py
      - name: Smoke test the packaged program
        shell: bash
        run: python scripts/smoke_packaged.py build/release/ytm-sync-*-windows
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/*.zip build/release/*.sha256 \
            --draft --verify-tag --generate-notes --title "YTM Sync $GITHUB_REF_NAME"
